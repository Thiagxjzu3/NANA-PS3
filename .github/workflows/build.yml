
name: NANA-PS3 Native Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  setup:
    name: Install official PS3DEV
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git cmake python3 \
            wget curl make pkg-config \
            libelf-dev libgmp-dev libssl-dev \
            zlib1g-dev libtool-bin

      - name: Download official PS3DEV
        run: |
          URL="https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz"

          curl -L --fail --retry 3 \
            "$URL" \
            -o "$RUNNER_TEMP/ps3dev.tar.gz"

          echo "76b1b3bc9ac260a4ece86da520225da7f2f4e334174e37b850093ff925eeb900  $RUNNER_TEMP/ps3dev.tar.gz" | sha256sum -c -

      - name: Extract PS3DEV
        run: |
          mkdir -p "$RUNNER_TEMP/ps3dev"

          tar -xzf "$RUNNER_TEMP/ps3dev.tar.gz" \
            -C "$RUNNER_TEMP/ps3dev"

          echo "PS3DEV=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"

          find "$RUNNER_TEMP/ps3dev" \
            \( -name ppu-gcc -o -name spu-gcc \) \
            -exec dirname {} \; \
            | sort -u >> "$GITHUB_PATH"

      - name: Verify PPU compiler
        run: |
          PPU_GCC="$(find "$PS3DEV" -name ppu-gcc -print -quit)"

          if [ -z "$PPU_GCC" ]; then
            echo "PPU GCC was not found."
            find "$PS3DEV" -maxdepth 4 -type f | head -100
            exit 1
          fi

          "$PPU_GCC" --version

      - name: Verify SPU compiler
        run: |
          SPU_GCC="$(find "$PS3DEV" -name spu-gcc -print -quit)"

          if [ -n "$SPU_GCC" ]; then
            "$SPU_GCC" --version
          else
            echo "SPU GCC not found in this package."
          fi

      - name: Save environment report
        run: |
          {
            echo "NANA-PS3"
            echo "PS3DEV package extracted successfully."
            find "$PS3DEV" \
              \( -name ppu-gcc -o -name spu-gcc \)
          } > ps3dev-report.txt

      - name: Upload environment report
        uses: actions/upload-artifact@v4
        with:
          name: nana-ps3-environment-report
          path: ps3dev-report.txt
