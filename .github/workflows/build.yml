
name: NANA-PS3 Native Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: PS3DEV C Compilation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl

      - name: Download PS3DEV
        run: |
          URL="https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz"

          curl -L --fail "$URL" -o ps3dev.tar.gz

          echo "76b1b3bc9ac260a4ece86da520225da7f2f4e334174e37b850093ff925eeb900  ps3dev.tar.gz" | sha256sum -c -

      - name: Extract SDK
        run: |
          mkdir -p "$RUNNER_TEMP/ps3dev"
          tar -xzf ps3dev.tar.gz -C "$RUNNER_TEMP/ps3dev"

          echo "PS3DEV=$RUNNER_TEMP/ps3dev/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$RUNNER_TEMP/ps3dev/ps3dev" >> "$GITHUB_ENV"

      - name: Configure toolchain
        run: |
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"

          test -x "$PS3DEV/ppu/bin/ppu-gcc"
          test -f "$PSL1GHT/ppu_rules"

      - name: Compile NANA-PS3 C source
        run: |
          mkdir -p build

          "$PS3DEV/ppu/bin/ppu-gcc" \
            -O2 -Wall -Wextra \
            -c engine/core/main.c \
            -o build/main.o

          file build/main.o

      - name: Upload compiled object
        uses: actions/upload-artifact@v4
        with:
          name: nana-ps3-ppu-object
          path: build/main.o
