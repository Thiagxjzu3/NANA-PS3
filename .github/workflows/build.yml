
name: NANA-PS3 Native Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  prepare:
    name: Prepare PS3 Development Environment
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            python3 \
            wget \
            curl \
            make \
            pkg-config

      - name: Check compiler
        run: |
          gcc --version
          make --version

      - name: Check project source
        run: |
          test -f engine/core/main.c
          echo "NANA-PS3 source found."

      - name: Check PS3 toolchain
        run: |
          if command -v ppu-gcc >/dev/null 2>&1; then
            ppu-gcc --version
          else
            echo "PPU GCC not installed yet."
          fi

          if command -v ppu-lv2-gcc >/dev/null 2>&1; then
            ppu-lv2-gcc --version
          else
            echo "PPU LV2 GCC not installed yet."
          fi

      - name: Environment report
        run: |
          echo "Environment preparation completed."
          echo "Native PS3 compilation is not configured yet."
